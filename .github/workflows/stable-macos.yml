name: stable-macos

on:
  workflow_call:
    inputs:
      MS_COMMIT:
        required: true
        type: string
      MS_TAG:
        required: true
        type: string
      RELEASE_VERSION:
        required: true
        type: string
      RELEASE_TITLE:
        required: true
        type: string
      LOOPHOLE_VERSION:
        required: true
        type: string
      SHOULD_BUILD:
        required: true
        type: string
      SHOULD_DEPLOY:
        required: true
        type: string

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  APP_NAME: Loophole
  ASSETS_REPOSITORY: loophole-ai/loophole-ide
  BINARY_NAME: loophole
  GH_REPO_PATH: loophole-ai/loophole-ide
  ORG_NAME: loophole-ai
  VERSIONS_REPOSITORY: loophole-ai/versions
  VSCODE_QUALITY: stable

jobs:
  build_macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: X64
            vscode_arch: x64
            npm_arch: x64
          - slug: ARM64
            vscode_arch: arm64
            npm_arch: arm64
    env:
      DISABLED: ${{ vars[format('DISABLE_STABLE_MACOS_APP_{0}', matrix.slug)] }}
      MS_COMMIT: ${{ inputs.MS_COMMIT }}
      MS_TAG: ${{ inputs.MS_TAG }}
      RELEASE_VERSION: ${{ inputs.RELEASE_VERSION }}
      RELEASE_TITLE: ${{ inputs.RELEASE_TITLE }}
      LOOPHOLE_VERSION: ${{ inputs.LOOPHOLE_VERSION }}
      SHOULD_BUILD: ${{ inputs.SHOULD_BUILD }}
      SHOULD_DEPLOY: ${{ inputs.SHOULD_DEPLOY }}
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
      OS_NAME: osx
      LOOPHOLE_BUILDER_ROOT: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v6
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Checkout builder PR
        env:
          PULL_REQUEST_ID: ${{ github.event.inputs.checkout_pr }}
        run: ./ci_repo.sh pr
        if: env.DISABLED != 'yes'

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Install icon build dependencies
        run: brew install imagemagick icoutils
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Pin npm version
        run: npm install -g "npm@<11.2.0"
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Clone Loophole IDE
        env:
          LOOPHOLE_IDE_COMMIT: ${{ github.event.inputs.ide_commit }}
          LOOPHOLE_IDE_BRANCH: ${{ github.event.inputs.ide_branch }}
        run: ./ci_repo.sh ide
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Platform CI setup
        env:
          CHECK_REH: 'no'
          DISABLE_DMG: ${{ vars.DISABLE_STABLE_DMG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_GH_INSTALL: ${{ env.SHOULD_DEPLOY != 'yes' && 'yes' || '' }}
        run: ./ci_platform.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_arch: ${{ matrix.npm_arch }}
          OS_NAME: osx
        run: ./build.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      # EILSEQ on APFS: npm log names the file with non-UTF-8 name refused.
      - name: Dump npm debug logs
        shell: bash
        run: |
          for f in ~/.npm/_logs/*-debug-*.log; do
            [[ -f "${f}" ]] || continue
            echo "::group::${f}"
            grep -iE 'EILSEQ|TAR_ENTRY_ERROR|extract|reify' "${f}" | tail -100
            echo "::endgroup::"
          done
        if: failure()

      - name: Upload npm debug logs
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs-macos-${{ matrix.vscode_arch }}
          path: ~/.npm/_logs/
          retention-days: 7
        if: failure()

      - name: Clean dependencies cache
        run: rm -rf /tmp/vscode-amd64-sysroot /tmp/debian_bullseye_amd64-sysroot
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Prepare assets
        env:
          OS_NAME: osx
          SHOULD_BUILD_REH: 'no'
          SHOULD_BUILD_REH_WEB: 'no'
          SHOULD_BUILD_ZIP: 'no'
          SHOULD_BUILD_SRC: 'no'
          SHOULD_BUILD_DMG: 'yes'
          CERTIFICATE_OSX_NEW_APP_PASSWORD: ${{ secrets.CERTIFICATE_OSX_NEW_APP_PASSWORD }}
          CERTIFICATE_OSX_NEW_ID: ${{ secrets.CERTIFICATE_OSX_NEW_ID }}
          CERTIFICATE_OSX_NEW_P12_DATA: ${{ secrets.CERTIFICATE_OSX_NEW_P12_DATA }}
          CERTIFICATE_OSX_NEW_P12_PASSWORD: ${{ secrets.CERTIFICATE_OSX_NEW_P12_PASSWORD }}
          CERTIFICATE_OSX_NEW_TEAM_ID: ${{ secrets.CERTIFICATE_OSX_NEW_TEAM_ID }}
        run: ./prepare_assets.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'

      - name: Upload to GitHub release
        env:
          STRONGER_GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN != '' && secrets.STRONGER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: ./release.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Update Loophole versions repository (macOS)
        env:
          FORCE_UPDATE: ${{ github.event.inputs.force_version }}
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          WRITE_VERSION_FILE: ${{ matrix.vscode_arch == 'x64' && 'yes' || 'no' }}
        run: ./update_version.sh
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes' && env.SHOULD_DEPLOY == 'yes'

      - name: Upload assets
        uses: actions/upload-artifact@v6
        with:
          name: loophole-macos-${{ matrix.vscode_arch }}
          path: assets/*
          if-no-files-found: error
          retention-days: 3
        if: env.DISABLED != 'yes' && env.SHOULD_BUILD == 'yes'
