name: Build Loophole CLI + Desktop

# Builds the CLI and the desktop app from loophole-ai/loophole-app (branch
# `loophole`) without publishing anything. It lives in this repository because
# loophole-app is private and its Actions minutes are metered, while this
# repository is public, so a build here costs nothing and needs no billing.
#
# Nothing is released: the only outputs are workflow artifacts.

on:
  workflow_dispatch:
    inputs:
      app_branch:
        type: string
        description: "loophole-app source branch"
        default: "loophole"
      scripts_ref:
        type: string
        description: "unused (kept so existing callers keep working)"
        default: "main"
      cli_version:
        type: string
        description: "CLI version string"
        default: "1.1.4"
      desktop_version:
        type: string
        description: "Desktop version string"
        default: "1.1.9"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      APP_BRANCH: ${{ github.event.inputs.app_branch || 'loophole' }}
      CLI_VERSION: ${{ github.event.inputs.cli_version || '1.1.4' }}
      DESKTOP_VERSION: ${{ github.event.inputs.desktop_version || '1.1.9' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out the Loophole source
        env:
          TOKEN_APP: ${{ secrets.APP_REPO_TOKEN }}
          TOKEN_STRONG: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          TOKEN_DEFAULT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # The app repo is private and holds everything needed to build, so a
          # single checkout of the fork branch is the whole source tree.
          for name in TOKEN_APP TOKEN_STRONG TOKEN_DEFAULT; do
            token="${!name:-}"
            [ -n "$token" ] || { echo "${name}: not configured"; continue; }
            if git clone --quiet --depth 1 --branch "${APP_BRANCH}" \
                 "https://x-access-token:${token}@github.com/loophole-ai/loophole-app.git" app 2>/dev/null; then
              echo "cloned loophole-app (${APP_BRANCH}) using ${name}"
              git -C app remote set-url origin https://github.com/loophole-ai/loophole-app.git
              exit 0
            fi
            echo "${name}: cannot read loophole-ai/loophole-app"
            rm -rf app
          done
          echo "::error::no configured token can read loophole-ai/loophole-app; grant one of APP_REPO_TOKEN / STRONGER_GITHUB_TOKEN access to that repository"
          exit 1

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: app
        env:
          BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache
        run: bun install

      - name: Build CLI
        working-directory: app
        env:
          BUILD_TARGET: cli
          OPENCODE_TARGET: windows-x64-baseline
          OPENCODE_VERSION: ${{ env.CLI_VERSION }}
          BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache
        run: bash ./build.sh

      - name: Build desktop app
        working-directory: app
        env:
          OPENCODE_TARGET: windows-x64
          OPENCODE_VERSION: ${{ env.DESKTOP_VERSION }}
          NODE_OPTIONS: --max-old-space-size=4096
          BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache
        run: bun run --cwd packages/desktop build

      - name: Package desktop app (unsigned, no publish)
        working-directory: app/packages/desktop
        env:
          OPENCODE_TARGET: windows-x64
          OPENCODE_VERSION: ${{ env.DESKTOP_VERSION }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.bun-cache
        run: bunx electron-builder --win --x64 --publish never --config electron-builder.config.ts

      - name: List build outputs
        run: |
          echo "--- CLI dist ---"
          find app/packages/cli/dist -maxdepth 3 -type f 2>/dev/null | head -40 || true
          echo "--- desktop dist ---"
          find app/packages/desktop/dist -maxdepth 2 -type f 2>/dev/null | head -40 || true
          ls -la app/packages/desktop/dist 2>/dev/null || true

      - name: Upload CLI to gofile
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          bin=$(ls -1 app/packages/cli/dist/*/bin/loophole-cli.exe 2>/dev/null | head -n1 || true)
          if [[ -z "$bin" ]]; then
            echo "::warning::no loophole-cli.exe under packages/cli/dist, skipping upload"
            find app/packages/cli/dist -maxdepth 4 -type f 2>/dev/null | head -20 || true
            exit 0
          fi
          bash scripts/upload-to-gofile.sh "$bin"

      - name: Upload desktop installer to gofile
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          exe=$(ls -1 app/packages/desktop/dist/loophole-desktop-win-x64.exe 2>/dev/null | head -n1 || true)
          if [[ -z "$exe" ]]; then
            echo "::warning::no desktop installer in packages/desktop/dist, skipping upload"
            ls -la app/packages/desktop/dist 2>/dev/null | head -20 || true
            exit 0
          fi
          bash scripts/upload-to-gofile.sh "$exe"

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: loophole-cli-windows-x64
          path: |
            app/packages/cli/dist/**
            app/packages/cli/bin/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload desktop app
        uses: actions/upload-artifact@v4
        with:
          name: loophole-desktop-windows-x64
          path: |
            app/packages/desktop/dist/**
          if-no-files-found: warn
          retention-days: 7
